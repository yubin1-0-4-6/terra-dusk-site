<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找不到这一页 — 暮土 · Terra Dusk</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#02040a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='34%25' cy='30%25' r='75%25'%3E%3Cstop offset='0' stop-color='%23ffd9b8'/%3E%3Cstop offset='.45' stop-color='%23e08a54'/%3E%3Cstop offset='1' stop-color='%23132a45'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
  <!-- 自包含样式：404 会出现在任意深度的路径下，外链 CSS 的相对路径未必成立 -->
  <style>
    :root {
      --bg: #02040a;
      --ink: #e9edf4;
      --muted: #7e889a;
      --dusk: #f0a778;
      --serif: "Instrument Serif", "Noto Serif SC", "Songti SC", Georgia, serif;
      --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(70% 60% at 72% 18%, rgba(240, 167, 120, 0.13), transparent 70%),
        radial-gradient(60% 50% at 15% 85%, rgba(74, 132, 205, 0.14), transparent 70%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.7;
    }
    main { max-width: 34rem; }
    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dusk);
    }
    h1 {
      margin: 0 0 1.25rem;
      font-family: var(--serif);
      font-size: clamp(2rem, 6vw, 3.1rem);
      font-weight: 400;
      line-height: 1.2;
    }
    h1 em { font-style: italic; color: var(--dusk); }
    p { margin: 0 0 2rem; color: var(--muted); }
    a.home {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border: 1px solid rgba(240, 167, 120, 0.5);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    a.home:hover, a.home:focus-visible { background: rgba(240, 167, 120, 0.12); border-color: var(--dusk); }
    footer { margin-top: 3rem; font-size: 0.8rem; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      a.home { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · 夜面</p>
    <h1>这一页转到了<em>背面</em>。</h1>
    <p>你要找的地址不在这里，也许是打错了一个字母，也许是我删掉了它。地球还在转，回首页继续读吧。</p>
    <a class="home" href="/" data-home>回到首页</a>
    <footer>暮土 · Terra Dusk</footer>
  </main>
  <script>
    /* 站点可能挂在 /terra-dusk-site/ 这样的子路径下，也可能挂在域名根：按当前路径推首页 */
    (() => {
      const parts = location.pathname.split('/').filter(Boolean);
      const base = parts.length > 1 ? '/' + parts[0] + '/' : '/';
      document.querySelectorAll('[data-home]').forEach((a) => (a.href = base));
    })();
  </script>
</body>
</html>
